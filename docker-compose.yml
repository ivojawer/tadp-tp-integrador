services:
  postgres:
    image: postgres:16-alpine
    container_name: logistica_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistica_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/02-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistica_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistica_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: logistica_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
